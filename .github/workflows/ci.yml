name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
          - os: ubuntu-latest
            shell: pwsh
          - os: macos-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable

      - name: Install Pester
        if: matrix.shell == 'pwsh'
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1 Name, Version

      # Install-Module in Windows PowerShell 5.1 takes ~105s on the runner; pwsh's Save-PSResource
      # takes a few seconds. Save into the 5.1 current-user module folder so 5.1 finds it.
      # -Repository PSGallery: the other registered repository (MicrosoftArtifactRegistry) has no
      # Pester and reports "Not Found", which fails the step.
      - name: Install Pester (via pwsh, for Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: pwsh
        run: |
          $modules = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'WindowsPowerShell\Modules'
          New-Item -ItemType Directory -Path $modules -Force | Out-Null
          Save-PSResource -Name Pester -Version '[5.0.0, )' -Repository PSGallery -Path $modules -TrustRepository -Quiet
          Get-ChildItem (Join-Path $modules 'Pester') -Name

      - name: Check Pester version
        run: |
          $pester = Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1
          $pester | Select-Object Name, Version, ModuleBase | Format-List
          if ($pester.Version -lt [version]'5.0.0') { throw "Pester 5+ not found (found $($pester.Version))." }

      - name: Run tests
        run: ./Invoke-Tests.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze modules
        run: |
          $results = Get-ChildItem -Directory -Exclude tests, .github |
              ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 }
          foreach ($r in $results) {
              $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
              $file = (Resolve-Path -Relative $r.ScriptPath) -replace '^\.[\\/]', ''
              Write-Output "::$level file=$file,line=$($r.Line),col=$($r.Column),title=$($r.RuleName)::$($r.Message)"
          }
          $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String -Width 200
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) issue(s)." }
          'No issues found.'
